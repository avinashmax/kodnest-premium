<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Notification Tracker | KodNest Premium</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/jobs.css">
    <link rel="stylesheet" href="css/digest.css">
    <link rel="stylesheet" href="css/test.css">
    <link rel="stylesheet" href="css/proof.css">
    <style>
        /* Layout Specific Styles for Job Tracker */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--color-bg);
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        .top-nav {
            height: 64px;
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 18px;
            color: var(--color-text-primary);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: var(--space-4);
            height: 100%;
        }

        .nav-link {
            display: flex;
            align-items: center;
            height: 100%;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
            border-bottom: 2px solid transparent;
            transition: all var(--transition-normal);
            padding: 0 var(--space-1);
        }

        .nav-link:hover {
            color: var(--color-text-primary);
        }

        .nav-link.active {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }

        /* Hamburger Menu (Mobile) */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            cursor: pointer;
            z-index: 1100;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--color-text-primary);
            transition: all var(--transition-normal);
        }

        /* Mobile Menu State */
        .mobile-menu-overlay {
            position: fixed;
            top: 64px;
            left: 0;
            width: 100%;
            height: calc(100vh - 64px);
            background: var(--color-white);
            transform: translateX(100%);
            transition: transform var(--transition-normal);
            display: flex;
            flex-direction: column;
            padding: var(--space-4);
            gap: var(--space-3);
            border-top: 1px solid var(--color-border);
            z-index: 999;
        }

        .mobile-menu-overlay.open {
            transform: translateX(0);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .mobile-menu-open .nav-links {
                /* When mobile menu is open, we can show links differently or use the overlay */
            }
        }

        /* Main Content Container */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-5);
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Centered content for placeholders */
            justify-content: center;
            min-height: calc(100vh - 64px);
        }

        .placeholder-content {
            text-align: center;
            opacity: 0;
            /* Animated in */
            animation: fadeIn 0.4s ease-out forwards;
        }

        .placeholder-title {
            font-size: 32px;
            font-family: var(--font-serif);
            color: var(--color-text-primary);
            margin-bottom: var(--space-2);
        }

        .placeholder-subtitle {
            font-size: 16px;
            color: var(--color-text-secondary);
            max-width: 480px;
            margin: 0 auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-brand">Job Notification Tracker</div>

        <!-- Desktop Links -->
        <div class="nav-links">
            <a href="#/dashboard" class="nav-link" data-path="/dashboard">Dashboard</a>
            <a href="#/saved" class="nav-link" data-path="/saved">Saved</a>
            <a href="#/digest" class="nav-link" data-path="/digest">Digest</a>
            <a href="#/settings" class="nav-link" data-path="/settings">Settings</a>
            <a href="#/jt/proof" class="nav-link" data-path="/jt/proof">Proof</a>
        </div>

        <!-- Mobile Hamburger -->
        <div class="hamburger" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileMenu">
        <!-- Replicated links for mobile with different styling if needed -->
        <!-- Populated via JS or hardcoded for simplicity -->
        <a href="#/dashboard" class="nav-link-mobile" onclick="closeMobileMenu()">Dashboard</a>
        <a href="#/saved" class="nav-link-mobile" onclick="closeMobileMenu()">Saved</a>
        <a href="#/digest" class="nav-link-mobile" onclick="closeMobileMenu()">Digest</a>
        <a href="#/settings" class="nav-link-mobile" onclick="closeMobileMenu()">Settings</a>
        <a href="#/jt/proof" class="nav-link-mobile" onclick="closeMobileMenu()">Proof</a>
    </div>

    <!-- Main Content -->
    <main class="app-container" id="app">
        <!-- Content injected via Router -->
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <style>
        /* Mobile Link Styles override */
        .nav-link-mobile {
            font-size: 20px;
            font-weight: 600;
            padding: var(--space-2) 0;
            color: var(--color-text-primary);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-link-mobile:last-child {
            border-bottom: none;
        }
    </style>
</body>

</html>
